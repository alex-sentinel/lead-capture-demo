<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in Touch</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 12px 20px; border: none; border-radius: 6px; background: #111; color: #fff; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <p>Fill this out and we'll get back to you fast.</p>
  <form id="leadForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>
    <button type="submit">Send</button>
  </form>
  <script>
    document.getElementById('leadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };
      await fetch('https://hernandezvxsystems.app.n8n.cloud/webhook-test/8caddbb8-8ee4-4ba7-a957-972dc0b86467', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      alert('Thanks! We got your message.');
    });
  </script>
</body>
</html>
